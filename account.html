<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My cabinet — L1rik</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#070b1a">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
</head>
<body>
<div class="wrap">
<header>
 <a class="logo" href="/" aria-label="L1rik home"><svg viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="110" fill="#6d4dff"/><path d="M150 128v232h120M318 190l46-40v210" fill="none" stroke="#fff" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/><circle cx="396" cy="396" r="22" fill="#26d086"/></svg><b>L1rik<span>.</span></b></a>
 <div class="lang" role="group" aria-label="Language"><button data-l="en" class="on">EN</button><button data-l="ru">RU</button></div>
</header>
<main>
 <h1 id="h">My cabinet</h1>
 <div id="v"><section class="card mut">…</section></div>
</main>
</div>
<script>
{const API='https://app.l1rik.com/api/auth/';
const T={en:{h:'My cabinet',em:'Email',tg:'Telegram',tgon:'connected ✓',tgoff:'not connected',tgb:'Connect Telegram',tgu:'Disconnect',tguq:'Disconnect Telegram from this cabinet?',tgq:'The Telegram app will open. Press Start in the bot to connect the Telegram account that is open on this device.',fail:'Could not do it right now. Please try again later.',tgn:'Connect Telegram to see your MT5 accounts here and get messages from the robot (bot @l1rikcontrolbot).',acc:'My accounts',none:'No MT5 account is connected yet. After purchase the admin connects your account; it then appears here.',bal:'Balance',eq:'Equity',tdy:'Today',open:'open trades',on:'online',off:'no signal',lic:'Licence until',out:'Sign out',shop:'Robots',cart:'Cart',adm:'<a class="btn" href="/admin.html">Open admin panel</a>',net:'The server could not be reached from your network. Try again or use mobile data.'},
ru:{h:'Мой кабинет',em:'Email',tg:'Telegram',tgon:'подключён ✓',tgoff:'не подключён',tgb:'Подключить Telegram',tgu:'Отключить',tguq:'Отключить Telegram от этого кабинета?',tgq:'Откроется Telegram. Нажмите Start в боте, чтобы подключить Telegram, открытый на этом устройстве.',fail:'Сейчас не получилось. Попробуйте позже.',tgn:'Подключите Telegram, чтобы видеть здесь свои счета MT5 и получать сообщения от робота (бот @l1rikcontrolbot).',acc:'Мои счета',none:'Счёт MT5 пока не подключён. После покупки администратор подключит ваш счёт, и он появится здесь.',bal:'Баланс',eq:'Эквити',tdy:'Сегодня',open:'открытых сделок',on:'в сети',off:'нет сигнала',lic:'Лицензия до',out:'Выйти',shop:'Роботы',cart:'Корзина',adm:'<a class="btn" href="/admin.html">Открыть панель администратора</a>',net:'Сервер недоступен из вашей сети. Попробуйте ещё раз или используйте мобильный интернет.'}};
let L='en',D=null;try{L=localStorage.getItem('l1lang')||'en'}catch(e){}if(!T[L])L='en';
const $=i=>document.getElementById(i),esc=x=>String(x==null?'':x).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const fm=v=>v==null||isNaN(v)?'--':Number(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),sg=v=>(v>0?'+':'')+fm(v),cl=v=>v>0?'ok':v<0?'err':'mut';
async function call(op){const r=await fetch(API+op,{method:'POST',credentials:'include',headers:{'content-type':'application/json'},body:JSON.stringify({lang:L})});const j=await r.json().catch(()=>({}));if(r.status==401||j.error=='need2'){location.href='/login.html?next=/account.html';throw new Error('login')}if(!r.ok)throw new Error(j.error||'net');return j}
function draw(){const m=T[L];document.documentElement.lang=L;$('h').textContent=m.h;document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l==L));if(!D)return;
 let h='<section class="card"><div class="it"><div><div class="mut">'+m.em+'</div><b>'+esc(D.email)+'</b></div><button class="btn gh" id="out" type="button">'+m.out+'</button></div>';
 h+='<div class="it" style="margin-top:14px"><div><div class="mut">'+m.tg+'</div><b class="'+(D.tg?'ok':'')+'">'+(D.tg?m.tgon:m.tgoff)+'</b></div>'+(D.tg?'<button class="btn gh" id="tgu" type="button">'+m.tgu+'</button>':'<button class="btn" id="tgb" type="button">'+m.tgb+'</button>')+'</div>'+(D.tg?'':'<p class="note">'+m.tgn+'</p>')+'</section>';
 if(D.role=='owner')h+='<section class="card"><p>'+m.adm+'</p></section>';
 h+='<section class="card"><b>'+m.acc+'</b>';
 if(!D.accounts.length)h+='<p class="mut">'+m.none+'</p>';
 for(const a of D.accounts){const on=a.t&&D.now-a.t<600000,pl=(a.tdy||0)+(a.fl||0);h+='<div style="border-top:1px solid var(--line);margin-top:12px;padding-top:12px"><div class="it"><div><b>'+esc(a.name||a.login)+'</b><div class="mut">'+esc(a.login)+' · <span class="'+(on?'ok':'err')+'">'+(on?m.on:m.off)+'</span></div></div><b class="'+cl(pl)+'">'+m.tdy+' '+sg(pl)+'</b></div><div class="mut" style="margin-top:6px">'+m.bal+' $'+fm(a.bal)+' · '+m.eq+' $'+fm(a.eq)+' · '+(a.n||0)+' '+m.open+(a.exp?' · '+m.lic+' '+new Date(a.exp).toISOString().slice(0,10).split('-').reverse().join('.'):'')+'</div></div>'}
 h+='</section><div class="row"><a class="btn gh" href="/#robots">'+m.shop+'</a><a class="btn gh" href="/cart.html">'+m.cart+'</a></div>';
 $('v').innerHTML=h;
 $('out').onclick=async()=>{try{await fetch(API+'logout',{method:'POST',credentials:'include',headers:{'content-type':'application/json'},body:'{}'})}catch(e){}location.href='/'};
 if($('tgu'))$('tgu').onclick=async()=>{if(!confirm(m.tguq))return;try{const r=await fetch(API+'tgunlink',{method:'POST',credentials:'include',headers:{'content-type':'application/json'},body:'{}'});if(!r.ok)throw 0;load()}catch(e){alert(m.fail)}};
 if($('tgb'))$('tgb').onclick=async()=>{if(!confirm(m.tgq))return;try{const j=await fetch(API+'tglink',{method:'POST',credentials:'include',headers:{'content-type':'application/json'},body:'{}'}).then(r=>r.json());if(j.url)location.href=j.url}catch(e){}}}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem('l1lang',L)}catch(e){}draw()});
async function load(){try{D=await call('me');draw()}catch(e){if(e.message!='login')$('v').innerHTML='<section class="card err">'+T[L].net+'</section>'}}
draw();load();document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});}
</script>
</body>
</html>

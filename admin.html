<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>L1RIK Control — Admin</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Site admin dashboard (2026-11-26). Own page for wide screens; data from app.l1rik.com /api/adm/* with the owner session cookie. */
:root{--bg:#F5F6FA;--card:#fff;--bd:#E1E3EE;--txt:#141629;--mut:#5A5D78;--g:#0E8A4F;--r:#C23B22;--a:#9A5B00;--pur:#6D4AFF;--navy:#14152B}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;font-size:14px}
a{color:#5B3FD9}
.app{display:flex;flex-wrap:wrap;min-height:100vh}
nav.side{flex:1 1 230px;max-width:250px;background:var(--navy);color:#E6E6F2;padding:22px 12px;display:flex;flex-direction:column;gap:3px}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 20px}.brand i{width:34px;height:34px;border-radius:9px;background:var(--pur);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;color:#fff}
.brand b{display:block;font-size:16px}.brand small{color:#A3A5C2}
nav.side button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:11px 12px;border-radius:9px;font-size:14px;color:#E6E6F2}
nav.side button:hover{background:#22244A}nav.side button.on{background:var(--pur);color:#fff;font-weight:600}nav.side button:focus-visible{outline:2px solid #C9BDFF}
.badge{background:#FF8A3D;color:#14152B;font-weight:700;font-size:12px;padding:1px 8px;border-radius:10px}
main{flex:999 1 560px;min-width:0;padding:24px 28px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
h1{margin:0;font-size:26px}.sub{color:var(--mut);font-size:13px;margin-top:4px}
.seg{display:inline-flex;background:#fff;border:1px solid var(--bd);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:8px 12px;border-radius:8px;font:inherit;font-size:13px;color:var(--txt);cursor:pointer}.seg button.on{background:var(--pur);color:#fff;font-weight:600}
.btn{border:1px solid var(--bd);background:#fff;color:var(--txt);border-radius:10px;padding:0 14px;min-height:40px;font:inherit;font-weight:600;font-size:13px;cursor:pointer}
.btn.p{background:var(--pur);border-color:var(--pur);color:#fff}.btn.ok{background:#E6F6EE;border-color:#A8DFC2;color:var(--g)}.btn.no{background:#FDEDEA;border-color:#F3C6BE;color:var(--r)}.btn.warn{background:#FFF4E0;border-color:#F2D49B;color:var(--a)}
.btn.sm{min-height:32px;padding:0 10px;font-size:12px}
.grid{display:grid;gap:14px}.k{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.two{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:16px 18px;min-width:0}
.card h2{margin:0 0 12px;font-size:15px}
.kl{font-size:13px;color:var(--mut)}.kv{font-size:24px;font-weight:700;margin-top:6px}.ks{font-size:12px;color:var(--mut);margin-top:3px}
.g{color:var(--g)}.r{color:var(--r)}.a{color:var(--a)}.mut{color:var(--mut)}
.pill{display:inline-block;font-size:11.5px;font-weight:600;border-radius:99px;padding:3px 9px;border:1px solid;white-space:nowrap}
.pg{color:var(--g);border-color:#A8DFC2;background:#E6F6EE}.pr{color:var(--r);border-color:#F3C6BE;background:#FDEDEA}.pa{color:var(--a);border-color:#F2D49B;background:#FFF4E0}.pb{color:#5B3FD9;border-color:#C9BDFF;background:#EEEAFF}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--mut);font-weight:600;font-size:12px;padding:10px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid #EEF0F6;white-space:nowrap}tr.cl{cursor:pointer}tr.cl:hover td{background:#F8F7FF}tr.sel td{background:#EEEAFF}
.nm b{display:block}.nm small{color:var(--mut)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.wrap{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,select{font:inherit;border:1px solid var(--bd);border-radius:10px;min-height:40px;padding:0 12px;background:#fff;color:var(--txt)}
input[type=search]{min-width:240px;flex:1}
label{font-size:12px;color:var(--mut);display:block;margin:8px 0 4px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;text-align:center}.cal div{border-radius:8px;padding:7px 0;font-size:12px;min-height:46px;background:#F5F6FA}.cal .hd{background:none;min-height:0;color:var(--mut);font-weight:600}
.cal .cg{background:#E6F6EE;color:var(--g)}.cal .cr{background:#FDEDEA;color:var(--r)}.cal b{display:block;color:var(--txt)}
.det{border:1px solid #C9BDFF;background:#FCFBFF}
.lst div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #EEF0F6}
#toast{position:fixed;right:20px;bottom:20px;background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px 16px;box-shadow:0 8px 30px rgba(20,22,43,.15);display:none;z-index:9}
body.hide .money{filter:blur(7px)}
#m.accpg{font-size:15.5px}#m.accpg table{font-size:15px}#m.accpg .mut{font-size:14px}#m.accpg h2{font-size:17px}#m.accpg .kl{font-size:14px}#m.accpg .pill{font-size:13px}
.lvl{border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-top:8px;background:#fff}.lvl details.legs{display:block;margin-top:6px;border-top:1px dashed var(--bd);padding-top:6px}.lvl summary{cursor:pointer;color:var(--mut);font-size:13px;text-align:right;list-style-position:inside}.lvl details[open] summary{color:var(--pur)}.pxbar{display:flex;justify-content:space-between;align-items:center;background:var(--pur);color:#fff;border-radius:10px;padding:10px 14px;margin-top:8px;font-weight:600}
.three{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.rk{position:relative;overflow:hidden;min-height:118px}.spk{position:absolute;right:0;bottom:0;width:55%;height:56px}.rtabs{display:flex}.rtabs button{flex:1;padding:12px;font-size:15px}
.sico{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;font-size:13px;font-weight:700;margin-right:6px;vertical-align:middle}
.cnt{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:10px;text-align:center}.cnt div{border:1px solid var(--bd);border-radius:10px;padding:6px 2px}.cnt small{display:block;color:var(--mut);font-size:12px}.cnt b{font-size:18px}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:12px}.dcell{border:1px solid var(--bd);border-radius:12px;padding:10px;min-height:92px;background:#fff}.dcell.pos{background:#E6F6EE;border-color:#A8DFC2}.dcell.neg{background:#FDEDEA;border-color:#F3C6BE}.dcell.fut{opacity:.45}.dcell.tod{outline:2px solid var(--pur)}
.cal2{display:grid;grid-template-columns:90px repeat(7,minmax(0,1fr));gap:6px;margin-top:12px}.cal2 .hd{text-align:center;color:var(--mut);font-weight:600}.cal2 .dcell{min-height:78px;padding:8px}.wsum{border:1px dashed var(--bd);border-radius:12px;padding:8px;text-align:center;display:flex;flex-direction:column;justify-content:center}.wsum small{color:var(--mut)}
.bar2{height:8px;border-radius:5px;background:#EEF0F6;margin-top:6px;overflow:hidden}.bar2 i{display:block;height:100%;border-radius:5px}
@media (max-width:900px){.wk{grid-template-columns:repeat(2,minmax(0,1fr))}.cal2{grid-template-columns:60px repeat(7,minmax(0,1fr));font-size:12px}}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}.pcard{border:1px solid var(--bd);border-radius:12px;padding:12px 14px;background:#fff}
.trk2{position:relative;height:8px;border-radius:5px;margin-top:10px;background:linear-gradient(90deg,#C23B22,#D5D8E6 45%,#0E8A4F)}.trk2 i{position:absolute;top:-4px;width:4px;height:16px;border-radius:2px;background:var(--navy);transform:translateX(-50%)}
th .srt{all:unset;cursor:pointer;font-weight:600;color:var(--mut)}th .srt:hover{color:var(--txt)}th .srt:focus-visible{outline:2px solid var(--pur);border-radius:4px}th[aria-sort=ascending] .srt,th[aria-sort=descending] .srt{color:var(--pur)}
svg text{font-family:Inter,sans-serif}
@media (max-width:900px){[style*="span 2"]{grid-column:auto!important}main{padding:16px}nav.side{max-width:none;flex-basis:100%;flex-direction:row;flex-wrap:wrap}.brand{width:100%;padding-bottom:8px}.kv{font-size:20px}.card svg[viewBox$="220"],.card svg[viewBox$="160"]{height:auto!important}}
</style>
</head>
<body>
<div class="app">
<nav class="side" aria-label="Bo'limlar">
 <div class="brand"><i>L</i><div><b>L1RIK Control</b><small>l1rik.com · Admin</small></div></div>
 <button data-t="d" class="on">Dashboard</button>
 <button data-t="h">Hisoblar</button>
 <button data-t="p">Foyda-zarar</button>
 <button data-t="r">Robotlar va strategiyalar</button>
 <button data-t="m">Odamlar</button>
 <button data-t="v">Robot versiyalari</button>
 <button data-t="s">VPS serverlar</button>
 <button data-t="u">Ulanish so'rovlari <span class="badge" id="bu" hidden></span></button>
 <button data-t="o">Xabarlar <span class="badge" id="bo" hidden></span></button>
 <button data-t="b">Boshqaruv</button>
 <div style="flex:1"></div>
 <button data-x="out">Chiqish</button>
</nav>
<main id="m"><div class="card mut">Yuklanmoqda…</div></main>
</div>
<div id="toast" role="status"></div>
<script>
{const API="https://api.l1rik.com";   /* Vercel bridge -> app.l1rik.com (ISP blocks Cloudflare) */
let PS="",D=null,PL=null,TAB="d",SC="all",PER="m",Q="",ST="all",ACC="",HIDE=false,UG="client";
try{HIDE=localStorage.getItem("l1hide")==="1"}catch(e){}
const $=s=>document.querySelector(s),esc=x=>String(x==null?"":x).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const fm=v=>v==null||isNaN(v)?"--":Number(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}).replace(/,/g," "),sg=v=>(v>0?"+":"")+fm(v),pc=v=>v>0?"g":v<0?"r":"mut";
const day=ms=>ms?new Date(ms).toISOString().slice(0,10).split("-").reverse().join("."):"",left=ms=>Math.ceil((ms-D.now)/864e5);
const ago=t=>{const m=Math.round((D.now-t)/6e4);return m<1?"hozir":m<60?m+" daq":m<1440?Math.round(m/60)+" soat":Math.round(m/1440)+" kun"};
const CAT={own:["O'zim","pb"],friend:["Do'st","pa"],client:["Mijoz","pg"]};
async function api(p,b){const r=await fetch(API+p,{method:"POST",credentials:"include",headers:{"content-type":"application/json"},body:JSON.stringify(b||{})});const j=await r.json().catch(()=>({}));if(r.status===401){location.href="/login.html?next=/admin.html";throw new Error("…")}if(!r.ok)throw new Error(j.error||("xato "+r.status));return j}
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.k);toast.k=setTimeout(()=>e.style.display="none",4000)}
async function act(b,ask,ask2){if(ask&&!confirm(ask))return;if(ask2&&!confirm(ask2))return;try{const r=await api("/api/adm/act",b);toast(r.msg||"Bajarildi");load()}catch(e){toast("⛔ "+e.message)}}
async function load(){try{const[s,p]=await Promise.all([api("/api/adm/state"),PL&&Date.now()-load.pt<6e4?Promise.resolve(PL):api("/api/adm/pl")]);D=s;if(p!==PL){PL=p;load.pt=Date.now()}if(document.activeElement&&/INPUT|SELECT/.test(document.activeElement.tagName))return;draw()}catch(e){if(e.message!=="…")$("#m").innerHTML='<div class="card r">'+esc(e.message)+"</div>"}}
function status(a){const t=Math.max(a.t||0,...a.charts.map(c=>c.t),a.seen||0);if(a.dev&&a.dev.mode==="rejected")return["Uzilgan","pr"];if(!t)return["Ulanmagan","pa"];if(D.now-t>6e5)return["Jim · "+ago(t),"pa"];if(a.charts.some(c=>/PAUSE|TO'XTA/i.test(c.status)))return["To'xtatilgan","pr"];return["Ishlayapti","pg"]}
const inSc=a=>SC==="all"||a.cat===SC,pl=a=>(Number(a.tdy)||0)+(Number(a.fl)||0);
const dAdd=(ds,n)=>{const d=new Date(ds+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
function plSum(L,f,t){let s=0,n=0;for(const l of L){const m=(PL.days||{})[l]||{};for(const d in m)if(d>=f&&d<=t){s+=m[d][0];n+=m[d][1]}}return[s,n]}
const perFrom=()=>{const t=PL.today;return PER==="d"?t:PER==="w"?dAdd(t,-6):PER==="m"?t.slice(0,8)+"01":dAdd(t,-89)};
const segSc=()=>'<div class="seg" role="group" aria-label="Guruh">'+[["all","Hammasi"],["own","O'zim"],["friend","Do'stlar"],["client","Mijozlar"]].map(([k,n])=>`<button data-sc="${k}" class="${SC===k?"on":""}" aria-pressed="${SC===k}">${n}</button>`).join("")+"</div>";
const segPer=()=>'<div class="seg" role="group" aria-label="Davr">'+[["d","Bugun"],["w","7 kun"],["m","Shu oy"],["q","3 oy"]].map(([k,n])=>`<button data-per="${k}" class="${PER===k?"on":""}" aria-pressed="${PER===k}">${n}</button>`).join("")+"</div>";
const head=(t,s)=>`<div class="top"><div><h1>${t}</h1><div class="sub">${s||""} · Yangilandi ${new Date(D.now).toTimeString().slice(0,5)}</div></div><div class="wrap">${segSc()}<button class="btn" data-x="eye" aria-label="Raqamlarni yashirish yoki ko'rsatish">${HIDE?"Raqamlarni ko'rsatish":"Raqamlarni yashirish"}</button><button class="btn" data-x="ref">Yangilash</button></div></div>`;
const kpi=(l,v,s,c)=>`<div class="card"><div class="kl">${l}</div><div class="kv ${c||""}">${v}</div>${s?`<div class="ks">${s}</div>`:""}</div>`;
function lineChart(L,days){if(!PL)return"";const pts=[];let c=0;for(let i=days-1;i>=0;i--){const d=dAdd(PL.today,-i);c+=plSum(L,d,d)[0];pts.push([d,c])}
 const W=760,H=220,lo=Math.min(0,...pts.map(p=>p[1])),hi=Math.max(1,...pts.map(p=>p[1])),X=i=>30+i*(W-40)/(pts.length-1||1),Y=v=>H-24-(v-lo)/(hi-lo||1)*(H-44);
 const path=pts.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(p[1]).toFixed(1)).join(" "),last=pts[pts.length-1][1];
 return `<svg role="img" aria-label="Jami foyda-zarar grafigi, oxirgi qiymat ${sg(last)}" viewBox="0 0 ${W} ${H}" style="width:100%;height:220px"><line x1="30" x2="${W-10}" y1="${Y(0)}" y2="${Y(0)}" stroke="#D5D8E6" stroke-dasharray="4 4"/><path d="${path} L${X(pts.length-1)} ${Y(lo)} L30 ${Y(lo)} Z" fill="#6D4AFF" fill-opacity=".09"/><path d="${path}" fill="none" stroke="#6D4AFF" stroke-width="2.5"/><text x="30" y="${H-4}" font-size="11" fill="#5A5D78">${day(Date.parse(pts[0][0]))}</text><text x="${W-10}" y="${H-4}" font-size="11" fill="#5A5D78" text-anchor="end">${day(Date.parse(pts[pts.length-1][0]))}</text><text x="${W-10}" y="14" font-size="12" fill="${last>=0?"#0E8A4F":"#C23B22"}" text-anchor="end" class="money">${sg(last)} $</text></svg>`}
function barChart(L,days){const v=[];for(let i=days-1;i>=0;i--){const d=dAdd(PL.today,-i);v.push(plSum(L,d,d)[0])}const W=760,H=160,m=Math.max(1,...v.map(Math.abs)),bw=(W-40)/v.length,y0=H/2;
 return `<svg role="img" aria-label="Kunlik foyda-zarar ustunlari" viewBox="0 0 ${W} ${H}" style="width:100%;height:160px"><line x1="30" x2="${W-10}" y1="${y0}" y2="${y0}" stroke="#D5D8E6"/>${v.map((x,i)=>`<rect x="${(30+i*bw+1).toFixed(1)}" width="${Math.max(1,bw-2).toFixed(1)}" y="${x>=0?y0-x/m*(y0-8):y0}" height="${Math.abs(x)/m*(y0-8)}" fill="${x>=0?"#0E8A4F":"#C23B22"}" rx="2"/>`).join("")}</svg>`}
function donut(st){const T=st.reduce((a,b)=>a+b[1],0)||1;let o=0;const C=2*Math.PI*52;return `<svg role="img" aria-label="Hisoblar holati" viewBox="0 0 140 140" style="width:140px;height:140px;flex:none">${st.map(([n,v,c])=>{const l=v/T*C,s=`<circle cx="70" cy="70" r="52" fill="none" stroke="${c}" stroke-width="18" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-o}" transform="rotate(-90 70 70)"/>`;o+=l;return s}).join("")}<text x="70" y="68" text-anchor="middle" font-size="22" font-weight="700" fill="#141629">${T}</text><text x="70" y="86" text-anchor="middle" font-size="11" fill="#5A5D78">hisob</text></svg>`}
function stats(A){const st={on:0,off:0,pause:0,exp:0};for(const a of A){const[s,c]=status(a);if(c==="pg")st.on++;else if(/To'xta|Uzil/.test(s))st.pause++;else st.off++;if(a.dev&&a.dev.mode==="client"&&a.dev.exp&&left(a.dev.exp)<=3)st.exp++}return st}
function vD(){const A=D.accounts.filter(inSc),L=A.map(a=>String(a.login)),t={bal:0,fl:0,tdy:0,n:0,pd:0};for(const a of A)for(const k in t)t[k]+=Number(a[k])||0;const st=stats(A),crit=D.crit.filter(c=>A.some(a=>String(a.login)===String(c.login)));
 const[m30]=PL?plSum(L,dAdd(PL.today,-29),PL.today):[0],S=A.filter(a=>a.bal!=null).sort((x,y)=>pl(y)-pl(x));
 let h=head("Dashboard","Barcha hisoblar holati va foyda-zarar")+'<div class="grid k">'+kpi("Hisoblar",A.length,st.on+" ta ishlayapti")+kpi("Umumiy balans",'<span class="money">$'+fm(t.bal)+"</span>")+kpi("Umumiy equity",'<span class="money">$'+fm(t.bal+t.fl)+"</span>",'<span class="money">ochiq savdolar '+sg(t.fl)+"</span>")+kpi("Bugungi foyda-zarar",'<span class="money">'+sg(t.tdy+t.fl)+"</span>","",pc(t.tdy+t.fl))+kpi("So'nggi 30 kun",'<span class="money">'+sg(m30)+"</span>","yopilgan savdolar",pc(m30))+kpi("Diqqat kerak",st.off+st.pause+st.exp+crit.length,crit.length+" kritik xato",st.off+st.pause+st.exp+crit.length?"r":"g")+"</div>";
 h+=`<div class="grid two"><section class="card" style="grid-column:span 2;min-width:0"><div class="row"><h2>Jami foyda-zarar (90 kun, yopilgan savdolar)</h2></div>${lineChart(L,90)}</section><section class="card"><h2>Hisoblar holati</h2><div class="wrap" style="gap:18px;flex-wrap:nowrap">${donut([["Ishlayapti",st.on,"#6D4AFF"],["Jim",st.off,"#B9BCD3"],["To'xtatilgan",st.pause,"#C23B22"]])}<div class="lst" style="flex:1"><div><span>Ishlayapti</span><b>${st.on}</b></div><div><span>Jim / ulanmagan</span><b>${st.off}</b></div><div><span>To'xtatilgan / uzilgan</span><b>${st.pause}</b></div><div><span>Obuna 3 kunda tugaydi</span><b>${st.exp}</b></div></div></div></section></div>`;
 const li=a=>`<tr class="cl" data-ac="${esc(a.login)}"><td class="nm"><b>${esc(a.name||a.login)}</b><small>${esc(a.login)}</small></td><td class="${pc(pl(a))} money" style="text-align:right;font-weight:700">${sg(pl(a))}</td></tr>`;
 h+=`<div class="grid two"><section class="card"><h2>Bugun eng ko'p foyda</h2><table>${S.filter(a=>pl(a)>0).slice(0,5).map(li).join("")||'<tr><td class="mut">Yo\'q</td></tr>'}</table></section><section class="card"><h2>Bugun eng ko'p zarar</h2><table>${S.slice().reverse().filter(a=>pl(a)<0).slice(0,5).map(li).join("")||'<tr><td class="mut">Yo\'q</td></tr>'}</table></section><section class="card"><div class="row"><h2>Kritik xatolar</h2><span class="pill ${crit.length?"pr":"pg"}">${crit.length}</span></div>${crit.slice(0,5).map(c=>`<div style="padding:6px 0;border-bottom:1px solid #EEF0F6"><b class="r">${esc(c.name||c.login)} · ${esc(c.sym)}</b><div class="mut">${esc(c.s)}</div></div>`).join("")||'<div class="mut">Xato yo\'q</div>'}</section></div>`;
 return h}
